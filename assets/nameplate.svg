<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="Noshin Nawar, CSE student, machine learning and software engineering" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Noshin Nawar</title>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.6" fill="#21262d"/>
    </pattern>
    <pattern id="dotsPink" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.9" fill="#ff5fa2"/>
    </pattern>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-320 0;800 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <mask id="sweep">
      <rect width="800" height="260" fill="url(#band)"/>
    </mask>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="0.5" stop-color="#ffe3f0"/>
      <stop offset="1" stop-color="#ff5fa2"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="798" height="258" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="1" width="798" height="258" rx="16" fill="url(#dots)"/>
  <rect x="1" y="1" width="798" height="258" rx="16" fill="url(#dotsPink)" mask="url(#sweep)" opacity="0.55"/>

  <g fill="none" stroke="#ff5fa2" stroke-width="2" stroke-linecap="round">
    <path d="M28 56 V30 H54"/>
    <path d="M746 30 H772 V56"/>
    <path d="M28 204 V230 H54"/>
    <path d="M746 230 H772 V204"/>
  </g>

  <text x="400" y="84" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#ff5fa2">CSE STUDENT</text>

  <text x="400" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#flow)">Noshin Nawar</text>

  <line x1="250" y1="176" x2="550" y2="176" stroke="#ff5fa2" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <text x="400" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="1" fill="#c9d1d9">Machine learning · Software engineering</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
